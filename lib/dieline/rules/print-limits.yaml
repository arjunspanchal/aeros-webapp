  confirmed_by: ARTWORK-CORTEX.md L1015
- id: FX-11
  rule: 'Food box: the WHOLE nest column fits inside one repeat incl. the interlock offset; the plate shows whole boxes only; the seam runs in the die gap of every
    lane.'
  check: column_len + interlock_offset <= repeat; no die fragment crosses repeat line; seam_clear > 0
  values:
