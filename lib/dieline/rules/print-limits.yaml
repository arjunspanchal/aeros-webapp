  rule: 'No gripper on flexo: 5 mm left and right of the boxes; print centred on the reel, rest is trim.'
  check: side_clear_each >= 5
  values:
    side_mm: 5
  applies_to:
  - food boxes on flexo
  severity: block
  source: FLX PART C step 4
  status: confirmed
- id: FX-13
  rule: 3 mm between boxes across lanes (this job; ask before reusing).
