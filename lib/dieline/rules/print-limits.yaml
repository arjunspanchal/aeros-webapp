  rule: '11 listing SOS sizes have no Viana cylinder in that window: ask before building.'
  check: sku not in [SOS-001, SOS-101, SOS-102, SOS-103, SOS-111, SOS-114, SOS-115, SOS-116, SOS-118, SOS-119, SOS-120]
