offset_sheet:
- id: OS-01
  rule: Blueline press maximum sheet is 25 x 36 in; nothing wider than 635 mm runs there.
  check: min(sheet_w, sheet_h) <= 635 and max(sheet_w, sheet_h) <= 914.4
  values:
    max_in:
    - 25
    - 36
    max_mm:
    - 635
    - 914.4
  applies_to:
  - all offset boxes
  - cup holders
  - hand-made bags
  - cup sheets at Blueline
  severity: block
  source: CTX L979-981 die_cutting_sheet_limits; CUS 'Sheet + nesting rules'; DIE 'Hand-made bags on offset' step 3
  status: confirmed
- id: OS-02
  rule: Blueline prints within 24.5 x 35.5 in (622.3 x 901.7) inside the 25 x 36 sheet.
  check: print_block_w <= 622.3 and print_block_h <= 901.7
  values:
    print_mm:
    - 622.3
    - 901.7
    print_in:
    - 24.5
    - 35.5
  applies_to:
  - Blueline offset jobs
  severity: block
  source: CUS 'Blueline prints 622 x 902 inside it'; CTX L973-978 blueline_offset_sheet (called 'max/std sheet'); DIE CHB '~1.9 mm bleed past the outer cuts inside
    Blueline's 622 print width'
  status: confirmed
- id: OS-03
  rule: Lucky Offset press maximum is 27.5 x 38 in.
  check: sheet_w <= 698.5 and sheet_h <= 965
  values:
    max_in:
    - 27.5
    - 38
    max_mm:
    - 698.5
    - 965
  applies_to:
  - Lucky Offset jobs
  severity: block
  source: CUS 'Lucky Offset press max = 27.5 x 38 in (Arjun 4-Nov-2026)'; MEM aeros_mill_reel_widths.md; CTX L2849 torta_haus lucky_27_5x38
  status: confirmed
- id: OS-04
  rule: Lucky runs the NATIVE holder on 635 x 980 sheets (roll 63.5 cut at 98).
  check: lucky_sheet in [[635, 980]] for that job
  values:
    sheet_mm:
    - 635
    - 980
    gripper_mm: 12.5
  applies_to:
  - NATIVE double cup holder
  severity: warn
  source: CTX L2185 lucky_offset_635x980; DIE 'Hand-made bags' step 3 'Lucky runs 635x980'
  status: confirmed
- id: OS-05
  rule: 25 x 36 and 30 x 40 in are the limits of our offset machines; paper is bought smaller, cut to the job.
  check: sheet <= [762, 1016] (any machine); prefer 25 x 36 when the count is the same
  values:
    limits_in:
    - - 25
      - 36
    - - 30
      - 40
    limits_mm:
    - - 635
      - 914.4
    - - 762
      - 1016
  applies_to:
  - Aeros-derived offset nests
  severity: block
  source: KLD 'OFFSET PRESS LIMITS (Arjun 2026-09-28)'
  status: confirmed
  confirmed_by: ARTWORK-CORTEX.md L216-224
  cortex_note: '30 x 40 runs exist: 135 mailer 4-up on 29 x 37 in and tray 20-up on 28.5 x 35.5 in, both "30 x 40 machine" (L4352)'
- id: OS-06
  rule: 28 x 40 / 30 x 40 only when the printer confirms the press; Blueline is 25 x 36 max.
  check: 'if sheet > 25x36: printer_press_confirmed == true else block'
  values: {}
  applies_to:
  - hand-made bags
  - boxes
  severity: warn
  source: DIE 'Hand-made bags on offset' step 3; CUS 'Exceptions need his call'
  status: confirmed
- id: OS-07
  rule: Gripper on one edge, at least 10 mm; other edges at least 5 mm (Aeros-derived nests).
  check: gripper_mm >= 10 and tail_mm >= 5 and side_mm >= 5
  values:
    gripper_min: 10
    other_edges_min: 5
  applies_to:
  - Aeros-derived offset nests
  severity: block
  source: KLD 'OFFSET PRESS LIMITS' (>= 10 mm gripper / long edges, >= 5 mm elsewhere)
  status: confirmed
  confirmed_by: ARTWORK-CORTEX.md L221-222
- id: OS-08
  rule: 'Costing allowances: 12 mm gripper on one edge, ~6 mm side lay, 3 mm between blanks; gripper edge needs >= 10 mm clear.'
  check: blank_block_w + 2*6 <= sheet_w and blank_block_h + 12 <= sheet_h and gap_between_blanks >= 3
  values:
    gripper: 12
    side_lay: 6
    gap_between_blanks: 3
    gripper_edge_clear_min: 10
  applies_to:
  - custom boxes
  severity: block
  source: CUS 'Sheet + nesting rules'
  status: confirmed
- id: OS-09
  rule: Hand-made bag sheet fit uses 12 mm gripper + 5 tail + 5 per side + 3 mm between blanks.
  check: blank_block_h + 12 + 5 <= sheet_h and blank_block_w + 2*5 <= sheet_w and gap >= 3
  values:
    gripper: 12
    tail: 5
    side: 5
    gap: 3
  applies_to:
  - hand-made SOS
  - D-cut
  - rope/flat handle bags
  severity: block
  source: DIE 'Hand-made bags on offset' step 1 (offset_bag_fit.py)
  status: confirmed
- id: OS-10
  rule: Lucky grips a 25 in edge with 12-13 mm; ask the vendor's gripper edge and depth before nesting.
  check: gripper_edge == short (25 in) and gripper_mm >= 12
  values:
    gripper_mm:
    - 12
    - 13
  applies_to:
  - Lucky Offset jobs
  severity: block
  source: CTX L2186 glue12_and_vendor_gripper; DIE 'Sheet nesting' step 8
  status: confirmed
- id: OS-11
  rule: 'Production nests: rows BUTT on a common straight cut (0 gap); only coincident straight cuts may be shared; curves, tucks and lock slits never touch.'
  check: shared_edges all straight and coincident; curved/slit edges gap > 0; no crossing cuts
  values:
    row_gap: 0
  applies_to:
  - cup holders
  - cartons
  - any multi-up die
  severity: block
  source: DIE 'Sheet nesting - production practice' steps 2 and 6; CTX L2234
  status: confirmed
- id: OS-12
  rule: Where blanks cannot interlock, leave a 10 mm channel.
  check: non_interlocking_gap >= 10
  values:
    channel_mm: 10
  applies_to:
  - cup holders
  - header cards
  severity: warn
  source: DIE 'Sheet nesting - production practice' step 4
  status: confirmed
- id: OS-13
  rule: Food-box nests keep >= 5 mm between pieces; mailer 0427 nests keep cut-to-cut gap >= 6 and margin >= 5.
  check: foodbox_gap >= 5; mailer_gap >= 6 and mailer_margin >= 5
  values:
    foodbox_gap: 5
    mailer_gap: 6
    mailer_margin: 5
  applies_to:
  - food boxes
  - 0427 mailers
  severity: block
  source: KLD food boxes 'Nest spacing follows the master die'; KLD mailer 'Offset nesting (Aeros-derived)'
  status: confirmed
  confirmed_by: ARTWORK-CORTEX.md L2901, L2991
  cortex_note: 'food-box press gate also: every piece >= 5 mm inside the sheet (L2991)'
- id: OS-14
  rule: 'Derived tub/fan nests: >= 5.8 mm in a column, >= 4.76 mm diagonal, >= 5 mm to the sheet edge.'
  check: col_gap >= 5.8 and diag_gap >= 4.76 and edge_margin >= 5
  values:
    col: 5.8
    diag: 4.76
    edge: 5
  applies_to:
  - paper tubs (derived nests)
  severity: block
  source: KLD 'No team layout at all (750 / 350 mL)'
  status: derived
  confirmed_by: ARTWORK-CORTEX.md L193-196
  cortex_note: 350 mL tub uses the team-400 spacing 2.2 mm column / 1.65 mm diagonal, margin 3 (L203-211)
- id: OS-15
  rule: Aeros-derived sheet = block + margins rounded UP to the next half inch, never AT a machine limit, never an odd metric sheet.
  check: sheet = ceil_half_inch(block + margins) and sheet < machine_limit
  values:
    round_to_in: 0.5
  applies_to:
  - Aeros-derived offset nests
  severity: warn
  source: KLD 'OFFSET PRESS LIMITS' (800 x 600 rejected)
  status: confirmed
  confirmed_by: ARTWORK-CORTEX.md L221-224
- id: OS-16
  rule: 'Standard offset sheets for hand-made bags: 18x23, 20x30, 22x28, 23x36, 25x36, 28x40 in.'
  check: sheet in [[18,23],[20,30],[22,28],[23,36],[25,36],[28,40]] (in)
  values:
    sheets_in:
    - - 18
      - 23
    - - 20
      - 30
    - - 22
      - 28
    - - 23
      - 36
    - - 25
      - 36
    - - 28
      - 40
  applies_to:
  - hand-made bags
  severity: block
  source: DIE 'Hand-made bags on offset' step 1
  status: confirmed
- id: OS-17
  rule: Cup holders run on 23 x 36 in at Blueline; always test 23 x 36 and 25 x 36 and pick on board per piece.
  check: evaluate both sheets; choose min(sheet_g / ups)
  values:
    sheet_in:
    - 23
    - 36
    sheet_mm:
    - 584.2
    - 914.4
  applies_to:
  - CHC cup holders
  - cartons
  severity: warn
  source: DIE 'Sheet nesting - production practice' step 1; CTX L625
  status: confirmed
- id: OS-18
  rule: 'Big one-piece blanks (cake boxes) are 1-up on 25 x 36: quote cut-to-size beside it.'
  check: 'if ups_on_25x36 == 1 and yield < 0.6: show cut_to_size option'
  values:
    yield_range:
    - 0.45
    - 0.58
  applies_to:
  - cake boxes
  - 4-cup carriers
  - large blanks
  severity: warn
  source: CUS 'Big one-piece blanks'
  status: confirmed
- id: OS-19
  rule: Utilisation under 70% must be explained and a better sheet shown.
  check: 'if sheet_use < 0.70: warn'
  values:
    min_use: 0.7
  applies_to:
  - custom boxes
  severity: warn
  source: CUS Workflow step 4
  status: confirmed
- id: OS-20
  rule: 'A blank longer than 914 mm cannot run at Blueline: split into two halves at a fold (box: + one 22 mm glue flap).'
  check: 'if blank_long_side > 914.4: require 2-piece'
  values:
    limit: 914.4
    added_glue_flap: 22
  applies_to:
  - gable boxes
  - large boxes
  - hand-made bags
  severity: block
  source: CUS 'Gable box, handle lock'; DIE gablelock '1022 mm exceeds Blueline's 914'; BAG 'If the sheet is longer than 914 mm'
  status: confirmed
- id: OS-21
  rule: Blueline walk-in minimum billing is 1,000 sheets; below it the 1,000-sheet charge is spread over the qty.
  check: billed_sheets = max(sheets, 1000)
  values:
    min_sheets: 1000
  applies_to:
  - Blueline offset boxes
  - stickers on offset
  severity: warn
  source: CUS 'Minimum billing 1,000 sheets'; CTX L1045
  status: confirmed
- id: OS-22
  rule: Blueline locked rate only at >= 25,000 sheets per run.
  check: 'if sheets >= 25000: locked rate else walk-in'
  values:
    locked_min_sheets: 25000
  applies_to:
  - Blueline offset
  severity: warn
  source: CTX L656-665 blueline_locked_zepto_z3
  status: confirmed
- id: OS-23
  rule: Max 4 Pantone on our machines; a 5th colour moves the job to CMYK.
  check: 'if n_pantone > 4: route = CMYK'
  values:
    max_pantone: 4
  applies_to:
  - all printed jobs (customer proof colour page)
  severity: block
  source: KLD 'Checklist before a proof leaves' COLOURS + TIMELINE page
  status: confirmed
  confirmed_by: ARTWORK-CORTEX.md L684-685
- id: OS-24
  rule: Printing both sides = 2 passes + 2 plates.
  check: passes = sides_printed; plates = colours_per_side summed
  values: {}
  applies_to:
  - boxes printed inside and out
  severity: warn
  source: CUS 'Repeat customers' (Roggenart)
  status: confirmed
- id: OS-25
  rule: Glue-seam strips must stay unlaminated (de-lam window).
  check: lamination ∩ glue_zone == empty
  values: {}
  applies_to:
  - laminated boxes
  - cup holders
  - mailers
  severity: block
  source: CTX L830-845 lamination_finishes; CUS 'Lamination'
  status: confirmed
- id: OS-26
  rule: Lamination is applied to the whole printed sheet before die-cut; rates gloss 0.45 / matt 0.55 / PVC 0.35 / blister 0.25 per (in2/100)/side; PVC is not food
    grade.
  check: 'if lamination == PVC and food_contact: warn'
  values:
    gloss: 0.45
    matt: 0.55
    pvc: 0.35
    blister: 0.25
  applies_to:
  - boxes
  severity: warn
  source: CTX L830-845 lamination_finishes
  status: confirmed
- id: OS-27
  rule: 'Gloss varnish has no rate on file: flag, don''t invent.'
  check: 'if finish == gloss_varnish: warn ''no rate'''
  values: {}
  applies_to:
  - boxes
  severity: warn
  source: CUS 'Lamination'
  status: confirmed
- id: OS-28
  rule: Offset is not viable at 40 GSM (pastry sleeve went flexo only).
  check: 'if gsm <= 40 and route == offset: warn (see contradictions C-09)'
  values:
    gsm: 40
  applies_to:
  - sleeves
  - wraps
  severity: warn
  source: CUS 'Sleeves / wraps / partitions'
  status: confirmed
- id: OS-29
  rule: Unprinted parts get a DIE layout (cut/crease only), and its C M Y K plates must be empty.
  check: 'if printed == false: plates_cmyk_ink == 0'
  values: {}
  applies_to:
  - plain inserts
  - trays
  severity: block
  source: KLD 'OFFSET PRESS LIMITS'
  status: confirmed
- id: OS-30
  rule: 'One rotated (90 deg) blank runs the grain the other way: flag it for the die maker.'
  check: 'if any blank rotated 90: warn grain'
  values: {}
  applies_to:
  - all offset nests
  severity: warn
  source: CUS 'Check interlock'; DIE 'Hand-made bags' step 8
  status: confirmed
- id: OS-31
  rule: 'Nesting files: only the CUT goes over the artwork; frame, dimensions and title never sit on a piece; dimension figures sit on the waste; no title / notes
    / swatches / fonts on the press page; state the registration tolerance per edge (e.g. 15 A.D. top 2.0, left 2.3, bottom 1.9 mm before white shows).'
  check: non-cut strokes ∩ pieces == empty; fonts == 0
  values:
    example_reg_tol_mm:
      top: 2.0
      left: 2.3
      bottom: 1.9
  applies_to:
  - all offset press files
  severity: block
  source: ARTWORK-CORTEX.md L73-77; L2380; L2385
  status: confirmed
- id: OS-32
  rule: 'Black must not be an extra plate on a punch-KLD job: /All marks -> the job spots, 100 K KLD lines -> non-printing "Dieline" separation (kld_job_colours.py).'
  check: 'tiffsep: ARTWORK-PUNCH = job spots only; LAYOUT = spots + Dieline; PUNCH = Dieline only'
  values:
    spot_px_tol_pct: 0.01
  applies_to:
  - offset cups on Blueline punch KLDs
  severity: block
  source: ARTWORK-CORTEX.md L4505
  status: confirmed
flexo_reel:
- id: FX-01
  rule: Repeat = teeth x 3.175 and the teeth must be a cylinder the printing vendor owns; never a computed tooth count.
  check: repeat_mm == teeth * 3.175 and teeth in vendor.cylinders
  values:
    tooth_pitch_mm: 3.175
  applies_to:
  - flexo bags
  - food boxes
  - cups
  - cup holders
  severity: block
  source: CTX L1886 / L2454 flexo_repeat_must_be_an_existing_cylinder; FLX 'Common to every flexo plate'; DIE 'Flexo repeat = an EXISTING cylinder'
  status: confirmed
- id: FX-02
  rule: 'Viana Packaging working cylinders (teeth: count), 95 in 28 sizes.'
  check: teeth in keys(values.viana) and count_available > 0
  values:
    viana:
      83: 2
      86: 2
      88: 2
      92: 2
      96: 4
      97: 4
      98: 4
      100: 3
      102: 5
      104: 4
      106: 2
      109: 5
      112: 4
      113: 5
      115: 4
      116: 4
      117: 4
      121: 4
      124: 2
      126: 3
      129: 4
      130: 1
      134: 4
      135: 4
      144: 4
      147: 2
      151: 3
      155: 4
    repeat_mm_range:
    - 263.525
    - 492.125
    gone_entirely:
    - 93
    - 99
    - 101
    - 110
    scrapped_2026_09_28:
      93: 2
      97: 2
      98: 2
      99: 2
      101: 2
      110: 2
      112: 2
  applies_to:
  - all Viana flexo
  severity: block
  source: CYL; FLX PART D; KLD 'Vendor cylinders'
  status: confirmed
  cortex_note: Unicorn Flexo runs the 250 mL SW master plate on 108 T / 342.90, reel 870 (ARTWORK-CORTEX.md L26-39); Unicorn has no full cylinder list.
- id: FX-03
  rule: 'Viana runs 83-155 T only: a repeat outside 263.5-492.1 mm has no cylinder.'
  check: 263.525 <= repeat_mm <= 492.125
  values:
    min_repeat: 263.525
    max_repeat: 492.125
  applies_to:
  - Viana flexo
  severity: block
  source: CTX L1886; DIE 'Flexo repeat'; KLD food box step 1 (528.5 mm -> 167 T, beyond Viana's 155 T)
  status: confirmed
- id: FX-04
  rule: Cylinders of the chosen teeth must cover the number of inks (3 of 3 = no spare).
  check: vendor.count[teeth] >= n_inks (warn if ==)
  values:
    example: Viana 3 x 100 T, 4 x 121 T, 3 x 126 T; only 2 x 106 T
  applies_to:
  - all Viana flexo
  severity: block
  source: FLX PART C step 0; FLX 12 oz DW note 'Viana holds only 2 x 106 T'; CUS NATIVE 'not enough 109T cylinders'
  status: confirmed
- id: FX-05
  rule: Viana machine max web is 950 mm; print width <= reel <= machine max.
  check: print_w <= reel_w <= 950
  values:
    max_web: 950
  applies_to:
  - Viana flexo bags and food-box board
  severity: block
  source: CYL max_web_width_mm; FLX PART C step 4 + PART D; KLD food box flexo
  status: confirmed
- id: FX-06
  rule: Food-box board reel to record now is 865 mm (RM in stock); 80 cm also mentioned; ask which.
  check: reel_w in stocked_reels (865 default)
  values:
    reel_mm: 865
  applies_to:
  - food boxes on Viana flexo
  severity: warn
  source: FLX PART C; KLD food box flexo
  status: confirmed
- id: FX-07
  rule: 'Bags: repeat = H + bottom (D-cut: flap + H + bottom); bag height axis is the repeat and blank width must fit the deckle; never rotate a blank to put width
    on the repeat.'
  check: teeth*3.175 == H + bottom (+flap for D-cut); blank_w <= reel_w
  values: {}
  applies_to:
  - SOS
  - PTH
  - FH
  - D-cut bags on flexo
  severity: block
  source: CTX L1886; FLX PART B step 1; DIE 'Flexo repeat'
  status: confirmed
- id: FX-08
  rule: Bag bottom on a flexo plate is what the cylinder leaves after H; team plates sit in the window G/2 + 13 to G/2 + 25.
  check: G/2 + 13 <= teeth*3.175 - H <= G/2 + 25
  values:
    window:
    - G/2 + 13
    - G/2 + 25
  applies_to:
  - SOS on flexo
  severity: block
  source: FLX PART D (register fit table); KLD 'Vendor cylinders'; DIE machine PTH note
  status: confirmed
