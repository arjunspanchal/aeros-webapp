# aeros-kld-artwork skill as a DESIGNER SPECIFICATION (21-Nov-2026), reconciled against Aeros Artworks/ARTWORK-CORTEX.md (outranks the skill).
# Changed items carry overridden_by + was. Source keys: KLD skill section names; ARTWORK-CORTEX.md line numbers.
artwork_cortex_reconciled: 2026-11-21 (ARTWORK-CORTEX.md, 5,671 lines; rule sections L1-1604 + L2654-3024 read in full, job log grepped for general rules)
meta:
  precedence:
  - Aeros Artworks/ARTWORK-CORTEX.md (always newer)
  - aeros-flexo-plates skill (all flexo plate files, from 21-Oct-2026)
  - this skill
  rule_zero: The supplied die / keyline / offset layout goes into the file EXACTLY as supplied, on its own layer; only artwork is added underneath. A layout that
    arrives WITH art is split on its content stream, never redrawn. (KLD 'Read the Cortex first')
  artwork_root: ~/Desktop/Aeros Webapp/Aeros Artworks/ (Customer Artwork/<Brand>/<Product>/, KLD Templates/<Category>/, Aeros Generic/<Product>/)
  listing_root: ~/Desktop/Aeros Webapp/Aeros Listing/<Category>/<SKU>/design/ (separate folder; blank assets only)
  precedence_note: 'This pass read ARTWORK-CORTEX.md (5,671 lines): rule sections L1-1604 and L2654-3024 in full; the job log (L1605-2653, L3025-5671) grepped for
    general rules. Where it differs it wins and the item carries overridden_by + was.'
workflow:
- step: 0a
  name: Customer record + brand folder
  do: 'Read Customer Artwork/<Brand>/_brand/BRAND.md (create the folder if missing; when the paying customer is not the brand, the brand folder sits inside Customer
    Artwork/<Customer>/<Brand>/). Then run aeros-customer-records: open or create cortex/customers/<id>.yaml, type direct|trader (ask), the art folder in its art
    list; a job is not filed until the folder is in that list.'
  src: ARTWORK-CORTEX.md L228-229; L307
- step: 1
  name: Read the rules
  do: Read Aeros Artworks/ARTWORK-CORTEX.md (outranks the skill); ARTWORKS-KNOWLEDGE.md = history, PROTOCOL.md = folder rules. On a customer job read Customer Artwork/<Brand>/_brand/BRAND.md
    first (colours, Pantone status, element sizes, layout rules, open questions, CHANNEL, press route).
  src: KLD 'Read the Cortex first'
- step: 2
  name: Get the source files
  do: '.ai attached in chat arrives CORRUPTED (U+FFFD bytes; qpdf: xref not found) -> take the original from Arjun''s Mac Downloads. Pull the SKU''s blank keyline
    + plain OBJ from Aeros Listing/<Category>/<SKU>/design/; if missing, building it is step one. Find the leaf folder by product name / size, not by an old SKU code
    (codes move, e.g. ICT-018 -> PT-052). OVERRIDE: new artwork takes its die files from the AEROS LISTING ONLY (never an old customer job folder or KLD Templates),
    and the listing path is stated on the PROOF.'
  src: KLD 'Read the Cortex first'
  overridden_by: ARTWORK-CORTEX.md L230
  was: Pull the SKU blank keyline from the Listing design/ folder (no exclusivity stated)
- step: 3
  name: Ask the standing questions (record answers in BRAND.md + placement json)
  ask:
  - 'LID (every tub / cup / bowl), in this order: 1. lid yes/no? 2. PET or PAPER? 3. how much wall does it cover (sets the lid line); paper lid: two-part disc + ring
    or one-piece pleated, and does the lid carry art? Get lid photos + vendor lid KLD.'
  - Do you need a DIGITAL SAMPLE file as well? (13 x 19 in sheet; cups / tubs stacked vertically)
  - 'Channel: DIRECT (maker''s mark on) or DEALER (no Aeros branding at all)'
  - 'Inks: Pantone spots or CMYK (''Pantone or CMYK?'' before keeping a customer''s spots)'
  - 'Double wall: is the inner cup printed (two print files) or plain white (one file)?'
  - 'Which printing vendor (offset: Blueline / Lucky Offset; flexo: Viana; finished tubs: Packwingz)'
  - 'When Arjun questions a dimension: ask for the MEASUREMENT (ruler over the rim, brim-to-bottom height) and put it in the tubgeo (rim_od, overall_h)'
  - Which die is master when a single-up and a team layout disagree (run DIECHECK overlay first)
  src: KLD 'Read the Cortex first', 'Cup anatomy', 'PRINTING VENDOR FILES', 'Food boxes'
- step: 4
  name: Read and verify the die
  do: Select cut paths by COLOUR, never by size/index; chain subpaths by endpoint (angular-sort fan points); fit both arcs of a fan with ONE common centre; supplier
    printing-area polygon reproduced exactly as the red line; measured allowances replace drawn ones; list every path OUTSIDE the die (hidden near-white art). A team
    file already on our die is translated only.
  src: KLD 'Reading a die', 'Measure, never derive', Checklist 1-2, 10
- step: 5
  name: Measure the source art
  do: 'Segment letters, fit baseline radius vs arc position about THEIR fan centre; report tilt and bow separately on flat-footed glyphs (foot span >= 0.55 mm); classify
    state: already on arc / straight chord / rigidly rotated block; read the deviation-plot SHAPE.'
  src: KLD 'Measure the source first', 'Read the SHAPE'
- step: 6
  name: Place the art
  do: Apply the geometry rule per element (baseline = true arc, edge = radial, width = constant arc length), re-seat glyphs rigidly (rotation + uniform scale, never
    shear), clip everything to the print area (print area U piece where the mark sits on bare board), keep die + safe on a locked layer, keep glue seam clean, joint
    keep-clear 8 mm on the left cut, maker's mark in the white fold strip (direct only).
  src: KLD 'The three geometry rules', 'RE-SEAT EACH GLYPH RIGIDLY', 'Placing artwork', 'The Aeros maker's mark'
- step: 7
  name: Colour
  do: 'State colour codes on the file (swatch per ink: Pantone SPOT/process + confirmed?, CMYK, source RGB/HEX, coverage note) + same in header and BRAND.md; confirmed
    Pantone = real /Separation; RGB team files rebuilt via FOGRA39; type at 100 K; check TAC and that builds match named Pantones.'
  src: KLD 'Colour'
- step: 8
  name: Build with one command (cups)
  do: 'python3 cup_pipeline.py <generator.py> <geo.json> <SKU> <label> -> PROOF, CURVECHECK, ARTONLY, textured OBJ, MESHCHECK, PANELVIEW, VIEWSHEET, render_prompt,
    MANIFEST. Generator kept in <Product>/_src/ so v+1 is a re-run. Build the OBJ before any render. Ask before spending Higgsfield credits. OVERRIDE: rendering is
    AUTOMATIC for every cup proof (VIEWSHEET -> Higgsfield gpt_image_2_5, 1:1, count 2, prompt = render_prompt.txt); Higgsfield OUTSIDE this pipeline still needs
    Arjun''s OK. Read RENDER-CORTEX.md before any render; every image that leaves is watermarked (-WM.png).'
  src: KLD 'Building it'
  was: Ask before spending Higgsfield credits
  overridden_by: ARTWORK-CORTEX.md L248-256
- step: 9
  name: Run the checks
  do: Checklist before a proof leaves (see checks:).
  src: KLD 'Checklist before a proof leaves'
- step: 10
  name: Customer proof
  do: Built by the family's proof builder (make_customer_proof.py etc.); every number computed from VERIFY / PLACEMENT json, never retyped; last page COLOURS + TIMELINE
    (proof_colour_guide.py); proof_scan.py clean; renders gated; no construction wording; send REVIEW PDF to Arjun (print file + curve check + mesh), not loose PNGs.
  src: KLD 'Building it', 'Checklist before a proof leaves'
- step: 11
  name: Approval -> PRINT
  do: A PRINT file exists only after the customer approves the matching PROOF IN WRITING.
  src: KLD 'Naming and versions'
- step: 12
  name: Press files
  do: 'Offset: run the size''s LOCKED recipe; ship THREE files (LAYOUT, ARTWORK-PUNCH, PUNCH) + the same three as the vendor set (corel_export.py, verify_corel.py
    PASS) in Printing Vendor Files/<Vendor>/. Flexo plates: aeros-flexo-plates skill. Any gate FAIL renames the file -FAILED; nothing delivered.'
  src: KLD 'Offset nesting for the blueline', 'PRINTING VENDOR FILES'
- step: 13
  name: File and record
  do: Save in Customer Artwork/<Brand>/<Product>/ (_checks/, _3d/, _src/, Printing Vendor Files/<Vendor>/, _superseded/); save BLANK keyline + BLANK nesting (+ tubs/bowls
    blank DIMENSIONED-OUTLINE) to the SKU design/ folder; keep a copy of the blank keyline in _src/ as <SKU>-KEYLINE-from-Aeros-Listing.pdf; insert a row per finished
    file into Supabase public.customer_artworks (supersede old row); update cortex/customers/<id>.yaml art list same turn; append to cortex §6, ARTWORKS-KNOWLEDGE.md,
    _INDEX.md, Aeros Listing/_DESIGN-ASSETS.md, re-run _build_design_status.py, propose skill update. Then python3 _tools/normalise_names.py . --apply; fix the corrected
    rule IN PLACE in the cortex body (not only §6); add any render row to RENDER-CORTEX.md Part 4.
  src: KLD 'Read the Cortex first', 'Folders', Checklist 16f + 17
  also_from: ARTWORK-CORTEX.md L269; L276-285
- step: 14
  name: Commit as you go
  do: File each deliverable as finished (bridge to the Mac drops); after a drop grep that the last edit landed before re-running.
  src: KLD 'Building it'
- step: 15
  name: Close the loop
  do: Append to §6, fix the rule in place, update ARTWORKS-KNOWLEDGE.md, _INDEX.md, RENDER-CORTEX.md, re-run _build_design_status.py, propose the SKILL.md update
    the same session ("if you would say next time we should..., it goes in both, now").
  src: ARTWORK-CORTEX.md L276-285
per_product:
  paper_cup_SW:
    template: Listing SKU design/ keyline; die records die-paths json (e.g. 8oz-dw-H92-55.91KT-die-paths.json); Olive dies 4020 SW when made at Olive
    areas: single fan (annulus sector); print area = red safe / team print area
    placement: polar coordinates about the fan centre; baselines true arcs (sag w^2/8R matters above ~20 mm width); edges radial; widths constant arc length; size
      elements in DEGREES of the cup (99 deg of visible wrap = 55.0 mm on 8 oz DW, 60.3 mm on 12 oz DW); 55 mm width limit came from an 8 oz job only
    safe: inside the red line; content >= 15 mm clear of the bottom cut (fills may run to the fold); joint keep-clear 8 mm off the LEFT cut
    bleed: 'to the cut only where the die allows; supplier die: fill their printing-area polygon exactly, stop at the flap'
    no_ink:
    - glue seam flap (~7.5 mm, right)
    - brim above the print top
    marks: 'maker''s mark (direct): bottom 3 mm white fold-in lip, printed INVERTED'
    colour: spots or CMYK per job; cupstock matched against Pantone C guide
    outputs:
    - PROOF
    - CURVECHECK
    - ARTONLY
    - OBJ + MESHCHECK + PANELVIEW + VIEWSHEET
    - REVIEW
    - CUSTOMER-PROOF
    - OFFSET-LAYOUT x3 (+ VENDOR set)
    - DIGITAL-SAMPLE (on request)
    src: KLD 'Cup anatomy', 'The three geometry rules', 'Other mappings and sizing', 'Placing artwork'
    zones_from_cortex:
      bottom_lip: 3 mm white fold-in lip; caption 2.8 pt black, baseline ~0.9 mm from the cut
      crimp_to_15mm: content-free (fills may run through)
      base_band: optional black bottom, from the crimp fold +1 mm overlap, bleed 1.5 mm past side cuts
      brim: ~10.5 mm always WHITE - no ink, not even a ground (RT - 10.5)
      glue_seam: right 7.5 mm, nothing important
      left_edge: joint keep-clear 8 mm (supersedes 3 mm cut tolerance)
      src: ARTWORK-CORTEX.md L407-427
    generic_aeros_system:
      wordmark: DejaVu Sans Bold ~46 pt on 8 oz, centred, mid-radius +4 mm
