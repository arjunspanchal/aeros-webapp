checks:
- name: closed outline
  what: cut paths selected by colour; every endpoint pairs within 0.05 mm; 0 open ends
  type: deterministic
- name: ink containment
  what: rasterise print-area polygon, dilate 2 px, 0 ink outside; ground and black measured separately by colour
  type: deterministic
- name: clip check
  what: every illustration stops at print area; customer die-line copy removed
  type: deterministic
- name: curve check
  what: baselines on arcs, edges on radials; tilt + bow separately on flat feet; house threshold <= 0.10 mm drift after re-seat; |bow| <= 0.15 mm under ~25 mm line
    is noise, threshold that matters 0.3 mm
  type: deterministic
- name: letterform gate
  what: 'rigid_gate.py: affine per glyph source -> ours; rigid = 1.0000/1.0000; limit 0.5 % anisotropy; exclude elements < ~0.5 mm across'
  type: deterministic
- name: glyph seat gate
  what: 'each glyph''s lowest point vs baseline: placed worst <= source worst + 0.03 mm (descenders listed, not scored)'
  type: deterministic
- name: baseline per glyph
  what: per connected glyph lowest radius (spread e.g. 0.129 mm)
  type: deterministic
- name: brim gate
  what: 0 fills / 0 glyphs above print top (rim line or curl start); 0 white gap under curl start when a neck exists; 2 px tol
  type: deterministic
- name: unrolled views
  what: each re-seated element unrolled about fan centre with grid, BEFORE/AFTER + bottom band (mark on white board)
  type: deterministic render, visual review
- name: element mesh check
  what: straight-on panel view at each element's azimuth
  type: deterministic render, visual review
- name: outside-die paths
  what: list every path outside the die before trusting a team file
  type: deterministic
- name: glue / joint
  what: nothing important in glue flap; glue points unprinted; nothing important within 8 mm of left cut
  type: deterministic
- name: maker's mark
  what: channel asked; one line on white board, caps centred in strip; glyph radius spread ~0; above bottom cut, below ground edge and fold; inversion checked by
    turning raster 180
  type: deterministic + visual
- name: ARTONLY
  what: '0 live text; 0 unconverted CMYK on spot job (cmyk_left: {}); 0 spot on CMYK job'
  type: deterministic
- name: colour block
  what: codes present and matching BRAND.md; spot separations real (tiffsep); fonts embedded at PROOF, outlined at PRINT; single page; QR decode
  type: deterministic
- name: QR decode
  what: OpenCV at 600 dpi (footers) / 1200 dpi Otsu inverted; decodes to that SKU's URL
  type: deterministic
- name: footer placeholder
  what: no 'AEROS FOOTER' placeholder text left on any keyline
  type: deterministic
- name: proof_scan.py
  what: banned terms (incl. 'plate', 'keyline' substrings on artwork guides) + text collisions; ALLOW=Pantone on spot jobs
  type: deterministic
- name: proof dims vs DB
  what: proof_dims_check.py (customer-proof skill) PASS dims = DB
  type: deterministic
- name: offset nesting gates
  what: slot count + turned count; fit median/max (0.03 / 0.20 same-die; 0.20 / 0.80 supplier layouts); 0 fonts; every blueline stroke present and unmoved (expect
    blueline + art strokes x slots); 0 colour ink outside print areas; 0 black outside cut pieces; maker's mark in every lip (direct) or none (dealer)
  type: deterministic
- name: offset split gates
  what: 'offset_layout_split(.py|_punchkld.py): PUNCH strokes identical, ARTWORK-PUNCH marks identical, outlines removed count (250: 43/31/12; 350: 63/27/36; 450:
    64/28/36 + 10 label fills); 0 black blueline strokes in companions; PUNCH 0 art ink; any FAIL renames all three -FAILED'
  type: deterministic
- name: verify_corel.py
  what: page size identical; stroke count identical, worst move <= 0.01 mm; tiffsep per plate within a few px; render diff < 0.05 % px; colourspaces indirect, PDF
    1.4, no ObjStm
  type: deterministic
- name: listing gate
  what: gs inkcov <= ~0.10 total per PDF; pdfimages -list empty; pdftotext no brand; no map_Kd in MTL; READMEs grep clean of customer names
  type: deterministic
- name: 500 mL tub die proof
  what: single fan cut corners on layout fillets <= 0.20 mm (Meltin 0.119)
  type: deterministic
- name: derived tub nests
  what: shared-cut coincidence, no overlap beyond the shared line, >= 5.8 mm in a column, >= 4.76 mm diagonal, >= 5 mm to sheet edge
  type: deterministic
- name: food box
  what: HOLE GATE 0 ink px; ROUND HOLES WHITE in every slot; FOLDCHECK (panel map, crease map, 3 mm safe, 10 mm grid)
  type: deterministic
- name: mailer nest
  what: gap >= 6, margin >= 5, bleed never reaches other cut, 0 fonts, plates CMYK + spot only, 0 ink outside mitred cut + 3 mm (>= 50 dpi)
  type: deterministic
- name: spot job second renderer
  what: check a spot job in a second renderer (Lab alternate drew white)
  type: visual
- name: render pre-flight
  what: foodbox_render_prompt.py checklist ticked against same-angle mesh views; every small type on a render read
  type: judgment / AI review
- name: renders white strip
  what: look for white strip under the rim (print top below curl start)
  type: visual
- name: split blueline
  what: sorted (rect, item-count) set of strokes equal before and after split
  type: deterministic
- name: live-text check
  what: get_texttrace / pdffonts on every customer source before a path-only rebuild
  type: deterministic
  src: ARTWORK-CORTEX.md L786
- name: reversed-type weight
  what: 'ARTONLY at 40 px/mm, white parts inside the print area, distance transform: thinnest part max stroke >= 0.15 mm'
  type: deterministic
  src: ARTWORK-CORTEX.md L788
- name: mark plate set
  what: tiffsep plate list with and without the maker's mark identical
  type: deterministic
  src: ARTWORK-CORTEX.md L582-583
- name: digital sample nest
  what: cut-to-cut >= 3.0, bleed >= 0.5 off neighbour cut, margin >= 5, 0 fonts, plates = ARTONLY plates
  type: deterministic
  src: ARTWORK-CORTEX.md L262-264
- name: 250 SW flexo master
  what: 'check_250sw_flexo_plate.py: page, 48 cut strokes, 6 eye-marks, strips identical < 0.02 mm; colours K100 or white; 0 fonts / images; no new separations'
  type: deterministic
  src: ARTWORK-CORTEX.md L33-35
- name: offset colour gates
  what: 'kld_job_colours.py: ARTWORK-PUNCH = job spots only; LAYOUT = spots + Dieline; PUNCH = Dieline only; spot px <= 0.01 %'
  type: deterministic
  src: ARTWORK-CORTEX.md L4505
- name: bleed probes (food box)
  what: probes 2.5 mm outside every inked cut edge must all be inked
  type: deterministic
  src: ARTWORK-CORTEX.md L2971-2972
- name: proof layout pass
  what: 'every text span bbox: 0 collisions, nothing past the margin; ARTONLY sheet == proof sheet'
  type: deterministic
  src: ARTWORK-CORTEX.md L766-770; L1397-1399
- name: other-brand grep
  what: proof text grepped for OTHER brands (whole words, BRAND env)
  type: deterministic
  src: ARTWORK-CORTEX.md L2973-2974
- name: bowl audit
  what: concentric (two-centre distance), true arcs (radial spread), square (side azimuths), equal sides, fillet radii; drawn-arc ratio vs labelled width ratio; DIECHECK
    overlay on the received axis
  type: deterministic
  src: ARTWORK-CORTEX.md L1184-1198; L1154-1160
- name: group-movement table
  what: on every re-issue pair element groups old vs new ARTONLY and list movement
  type: deterministic
  src: ARTWORK-CORTEX.md L4067
- name: tilt calibration
  what: any tilt measure reads 0.00 deg on the die's own cut arc before it is trusted
  type: deterministic
  src: ARTWORK-CORTEX.md L540-543
