judgment_calls:
  ask_customer_or_arjun:
  - Lid yes/no, PET/paper, coverage, lid build, lid art
  - Digital sample yes/no
  - Channel direct vs dealer (maker's mark / Aeros footer on or off)
  - Pantone vs CMYK; which Pantone (colour selection is chargeable); approve substitution of house builds
  - DW inner printed or plain
  - Printing vendor (Blueline / Lucky / Viana / Packwingz)
  - Which die is master when single-up and team layout disagree
  - Measurements when a dimension is questioned (rim OD, overall H)
  - 'Sheet size for a derived nest (750: 680 x 450; 350: 680 x 415); press / die maker to confirm before first run'
  - Where a knurl sits when a measured knurl and a guide disagree (settle on brim capacity)
  - Mark position where no hidden white strip exists
  - Unknown labels on a team file; wording errors in a layout title (e.g. 'Flexo' on an offset sheet)
  - Lid skirt printed or white
  - Customer method switch (screen <-> offset)
  - Tints needed on a screen-printed bag
  - Bag footer QR URL pattern (aeros-x.com/products/<SKU> NOT confirmed live)
  - 'RULED 2026-11-21: cup offset = 3 files (ARTWORK-PUNCH with outlines, LAYOUT without, VENDOR with all dimensions + colours)'
  - Whether a QR on a flood gets a knockout panel or goes inverted (disputed)
  - Default logo size on 8 oz DW (42 vs 55 mm datapoints)
  - Brown box = kraft board or printed brand-colour flood
  - Inner-cup colour for renders (render only the chosen option)
  - Mockup size vs our scale (state the difference on the proof)
  model_judgment_today:
  - Classifying a source element's state (on arc / chord / rotated block) from the deviation plot and choosing the fix
  - 'Which mapping per element group: arc re-seat, rigid, re-roll at constant size, or leave alone (distressed type, intrinsic slant)'
  - Scale S per element (S = 1 vs height ratio) from how the customer treated it across sizes
  - Grouping lines of a rotated block (by baseline radius), attaching small parts
  - Logo size as a fraction of visible wrap carried across a family
  - Which strokes in a customer file are the die cut line vs art (rule given, edge cases judged)
  - Tracing shapes seen through letters for dark-flood knockouts; tint levels in one-ink reductions (e.g. 50 / 60 / 35 %)
  - Colour mapping for ink reductions and gradients on 2 inks
  - Customer proof layout positions on wide fans (spec_frame, art_shift_mm, check_y)
  - 'Reading renders: proportions, invented small print, white liners, inner faces; render prompts written from THIS artwork'
  - 'Whether an Arjun complaint (''looks stretched'', ''not along the mesh'') is real: rule = go and measure before defending'
  - Trusting a supplier vector guide over a ruler reading on a crinkled sample
  - Re-lay ratios per panel when a sample sits on another size die
  - 'Splitting customer files: which fills/text are art vs die vs captions'
  - Tracing raster logos (thresholds, which parts re-typeset)
  src: KLD throughout, esp. 'Read the Cortex first', 'Measure the source first', 'Other mappings and sizing', 'Bag Customer Proofs', 'Checklist'
gaps_for_the_designer:
- 'Default logo size: datapoints only (8 oz DW 42 or 55 mm; tubs band - 3 mm, two logos at 1/4 and 3/4; PET caps 38 tall / ~80-86 wide); no % rule for bags or boxes'
- Minimum positive text size for flexo bags and offset boxes not given (only reverse-out 3.3 pt, reversed stroke 0.15 mm, knock-out 0.12 mm, dry offset 0.25 mm, maker's
  mark 2.8 pt)
- No TAC limit number (only 270-317 % flagged)
- Front/back mirroring for bags not specified (boxes and mailers now covered)
- Folder-gluer seam width on cartons that must stay ink-free not given
- Cup holders not specified in the KLD skill or the artwork cortex
